<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>The Deal Stock Scanner — Test 2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,Arial;color:#111827}
main{max-width:560px;margin:auto;padding:18px 14px 30px}
h1{font-size:23px;margin:0}.sub{color:#6b7280;font-size:13px;margin:4px 0 16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin-bottom:12px}
button,input{font:inherit}button{min-height:48px;border:0;border-radius:12px;font-weight:700;padding:0 16px}
.scan{width:100%;background:#111827;color:#fff;font-size:17px}.secondary{background:#eef0f3}
.manual{display:flex;gap:8px}.manual input{flex:1;min-width:0;border:1px solid #d1d5db;border-radius:12px;padding:0 12px;font-size:17px}
.status{font-size:13px;color:#6b7280;margin-top:9px}
.result{display:none}.badge{display:inline-block;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800}
.ok{background:#dcfce7;color:#166534}.no{background:#fee2e2;color:#991b1b}
.qty{font-size:34px;font-weight:800;margin:8px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eee;font-size:14px}
.label{color:#6b7280}.value{text-align:right;font-weight:600}
#camera{display:none;width:100%;background:#000;border-radius:14px;overflow:hidden;position:relative;margin-top:12px}
#video{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#000}
.scanbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:86%;height:30%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.18);pointer-events:none}
.tools{display:none;gap:8px;margin-top:10px}.tools button{flex:1;background:#eef0f3}
.zoom{display:none;align-items:center;gap:8px;margin-top:10px;color:#6b7280;font-size:12px}.zoom input{flex:1}
.hint{font-size:12px;color:#6b7280;margin-top:8px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}
</style>
</head>
<body>
<main>
<h1>📦 The Deal – Stock Scanner</h1>
<div class="sub">Test 2 — retail barcode scanner</div>

<div class="card">
<button id="scan" class="scan">📷 Scan Barcode</button>
<div id="camera">
  <video id="video" playsinline autoplay muted></video>
  <div class="scanbox"></div>
</div>
<div id="tools" class="tools">
  <button id="torch">🔦 Flash</button>
  <button id="stop" class="secondary">✕ Close Scanner</button>
</div>
<div id="zoomLine" class="zoom">
  <span>Zoom</span><input id="zoom" type="range" min="1" max="2" step=".1" value="2"><b id="zoomVal">2×</b>
</div>
<div id="status" class="status">Ready — tap Scan Barcode.</div>
</div>

<div class="card">
<div class="manual">
<input id="q" inputmode="numeric" autocomplete="off" placeholder="Barcode / Item No.">
<button id="go" class="secondary">Search</button>
</div>
<div class="hint">Manual entry is available if a barcode cannot be scanned.</div>
</div>

<div id="result" class="card" aria-live="polite"></div>
</main>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
<script src="data.js"></script>
<script>
const P=window.PRODUCTS||[], M=new Map();
function norm(v){
  const s=String(v??'').trim().replace(/\s/g,'');
  if(!/^\d+$/.test(s)) return s;
  return s.replace(/^0+(?=\d)/,'');
}
P.forEach(p=>{
  if(p.barcode) M.set(norm(p.barcode),p);
  if(p.itemNo) M.set(norm(p.itemNo),p);
});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let reader=null,stream=null,track=null,running=false,lastCode='',lastTime=0,zoomMax=1;

function beep(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    const a=new C(),o=a.createOscillator(),g=a.createGain();
    o.frequency.value=1000;g.gain.value=.15;o.connect(g);g.connect(a.destination);
    o.start();o.stop(a.currentTime+.12);
  }catch(e){}
}
function search(x){
  x=norm(x); if(!x)return;
  const p=M.get(x),r=$('result');
  if(!p){
    r.style.display='block';
    r.innerHTML='<span class="badge no">NOT AVAILABLE</span><div class="qty">No Match</div>'+
      '<div class="row"><span class="label">Searched</span><span class="value">'+esc(x)+'</span></div>'+
      '<div class="actions"><button id="next" class="scan">📷 Scan Next</button></div>';
    $('status').textContent='No barcode or Item No. found.';
  }else{
    const ok=Number(p.soh)>0; beep();
    r.style.display='block';
    r.innerHTML='<span class="badge '+(ok?'ok':'no')+'">'+(ok?'AVAILABLE':'NOT AVAILABLE')+'</span>'+
      '<div class="qty">'+esc(p.soh)+' unit'+(Number(p.soh)==1?'':'s')+'</div>'+
      [['Barcode',p.barcode],['Item No.',p.itemNo],['Item',p.item],['Brand',p.brand],
       ['Category',p.division],['Gender',p.gender],['Size',p.size]]
      .map(a=>'<div class="row"><span class="label">'+a[0]+'</span><span class="value">'+esc(a[1]||'-')+'</span></div>').join('')+
      '<div class="actions"><button id="next" class="scan">📷 Scan Next</button></div>';
    $('status').textContent=ok?'Match found — '+p.soh+' unit(s) available.':'Match found — 0 units.';
  }
  if($('next'))$('next').onclick=()=>{r.style.display='none';start();};
}

async function start(){
  if(running)return;
  $('result').style.display='none';
  $('camera').style.display='block';
  $('tools').style.display='flex';
  $('scan').textContent='✕ Close Scanner';
  $('status').textContent='Move closer and place the barcode inside the white box.';
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},
      audio:false
    });
    $('video').srcObject=stream;
    await $('video').play();
    track=stream.getVideoTracks()[0];
    const caps=track.getCapabilities?track.getCapabilities():{};
    if(caps.torch)$('torch').style.display='block';else $('torch').style.display='none';
    if(caps.zoom){
      zoomMax=Math.min(2,Number(caps.zoom.max)||2);
      $('zoom').max=zoomMax;$('zoom').value=2;$('zoomVal').textContent='2×';
      $('zoomLine').style.display='flex';
      await track.applyConstraints({advanced:[{zoom:2}]}).catch(()=>{});
    }else{
      $('video').style.transform='scale(2)';
      $('video').style.transformOrigin='center center';
      $('zoomLine').style.display='flex';
    }
    running=true;

    reader=new ZXingBrowser.BrowserMultiFormatReader();
    const hints=new Map();
    hints.set(ZXingBrowser.DecodeHintType.POSSIBLE_FORMATS,[
      ZXingBrowser.BarcodeFormat.EAN_13,
      ZXingBrowser.BarcodeFormat.EAN_8,
      ZXingBrowser.BarcodeFormat.UPC_A,
      ZXingBrowser.BarcodeFormat.UPC_E,
      ZXingBrowser.BarcodeFormat.CODE_128,
      ZXingBrowser.BarcodeFormat.CODE_39
    ]);
    reader.decodeFromVideoElement($('video'),(result,err)=>{
      if(!running||!result)return;
      const code=result.getText();
      const now=Date.now();
      if(code===lastCode&&now-lastTime<1500)return;
      lastCode=code;lastTime=now;
      close();
      $('q').value=code;
      search(code);
      $('status').textContent='Barcode scanned.';
    },hints);
  }catch(e){
    console.error(e);
    close();
    $('status').textContent='Camera unavailable. Check camera permission.';
  }
}

function close(){
  running=false;
  try{reader?.reset()}catch(e){}
  reader=null;
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;track=null;
  $('video').srcObject=null;
  $('camera').style.display='none';
  $('tools').style.display='none';
  $('zoomLine').style.display='none';
  $('scan').textContent='📷 Scan Barcode';
}
$('scan').onclick=()=>running?close():start();
$('stop').onclick=close;
$('torch').onclick=async()=>{
  if(!track)return;
  const c=track.getCapabilities?.()||{};
  if(c.torch)await track.applyConstraints({advanced:[{torch:true}]}).catch(()=>{});
};
$('zoom').oninput=async e=>{
  const z=Number(e.target.value);$('zoomVal').textContent=z+'×';
  if(track&&zoomMax>1)await track.applyConstraints({advanced:[{zoom:z}]}).catch(()=>{});
  else $('video').style.transform=`scale(${z})`;
};
$('go').onclick=()=>search($('q').value);
$('q').onkeydown=e=>{if(e.key==='Enter')search($('q').value)};
$('status').textContent=P.length+' SKUs loaded. Ready to scan.';
</script>
</body>
</html>
